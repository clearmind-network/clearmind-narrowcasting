
name: Test KPN CSP Reporter API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-kpn:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: KPN storingen en onderhoud filteren
        run: python kpn_feed.py
        
