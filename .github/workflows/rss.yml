
name: Clear Mind IT RSS Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
    paths:
      - 'berichten.json'
      - 'generate_rss.py'
      - '.github/workflows/rss.yml'

permissions:
  contents: write

concurrency:
  group: clearmind-rss
  cancel-in-progress: false

jobs:
  generate-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: RSS-feed genereren
        run: python generate_rss.py

      - name: RSS-bestand opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          if ! git diff --cached --quiet; then
            git commit -m "Automatische RSS-update"
            git push
          fi
